<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תמונות מאושרות למטע</title>
  <style>
    :root { color-scheme:light; --ink:#1c2930; --muted:#617078; --line:#dbe4e6; --bg:#f6f8f7; --card:#fff; --accent:#246b49; --danger:#9b3b31; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial,"Noto Sans Hebrew",sans-serif; }
    header { position:sticky; top:0; z-index:2; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); padding:14px max(16px,calc((100% - 1180px)/2)); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    h1 { margin:0; font-size:1.25rem; } .hint { flex:1; color:var(--muted); font-size:.9rem; } a { color:#245c95; } .back { white-space:nowrap; }
    main { max-width:1180px; margin:22px auto; padding:0 16px 48px; } .notice { background:#fff8e9; border:1px solid #eed39b; color:#684d13; padding:12px; border-radius:10px; margin-bottom:18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }.card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }.thumb { width:100%; aspect-ratio:4/3; object-fit:cover; background:#edf1f1; display:block; }.copy { padding:11px; display:grid; gap:7px; }.name { font-weight:700; }.file { direction:ltr; color:var(--muted); font:12px ui-monospace,monospace; }.meta { color:var(--muted); font-size:.82rem; }.actions { display:flex; justify-content:space-between; align-items:center; gap:8px; }.remove { border:0; border-radius:8px; background:var(--danger); color:#fff; padding:8px 10px; cursor:pointer; font:inherit; }.empty { background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; color:var(--muted); }
  </style>
</head>
<body>
  <header><h1>תמונות מאושרות</h1><span class="hint" id="summary">טוען…</span><a class="back" href="image-choices.html">חזרה לבחירה</a></header>
  <main><div class="notice">מוצגות רק התמונות שאושרו. לחיצה על <b>לא רוצה את התמונה</b> מסירה אותה מכאן, פותחת מחדש את הזן, ודוחה את אותה תמונה כדי שלא תוצע שוב.</div><div id="app"></div></main>
  <script>
    const KEY='orchard-image-choices-v1', REJECTED_KEY='orchard-image-rejected-candidates-v1', SOURCE_REJECTED_KEY='orchard-image-source-rejections-v1';
    const selections=JSON.parse(localStorage.getItem(KEY)||'{}');
    const rejected=JSON.parse(localStorage.getItem(REJECTED_KEY)||'{}');
    const sourceRejected=JSON.parse(localStorage.getItem(SOURCE_REJECTED_KEY)||'{}');
    const app=document.querySelector('#app');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function csv(text) { const rows=[],row=[]; let active=row,cell='',quoted=false; for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1]; if(c==='"'&&quoted&&n==='"'){cell+='"';i++;} else if(c==='"') quoted=!quoted; else if(c===','&&!quoted){active.push(cell);cell='';} else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;active.push(cell);if(active.some(Boolean))rows.push([...active]);active.length=0;cell='';} else cell+=c;} if(cell||active.length){active.push(cell);rows.push([...active]);} const [head,...data]=rows;return data.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||'']))); }
    async function load(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(path);return csv(await r.text());}
    function sync(){fetch('/api/selections',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({selections,rejected,sourceRejected})}).catch(()=>{});}
    function persist(){localStorage.setItem(KEY,JSON.stringify(selections));localStorage.setItem(REJECTED_KEY,JSON.stringify(rejected));localStorage.setItem(SOURCE_REJECTED_KEY,JSON.stringify(sourceRejected));sync();}
    function render(current,candidates,archive,manifest){const validFiles=new Set(manifest.map(x=>x.file));const byId=new Map([...archive,...candidates].map(c=>[`${c.file}::${c.candidate_id}`,c])); const rows=[]; const present=new Set(); current.filter(x=>validFiles.has(x.file)&&!sourceRejected[x.file]).forEach(x=>{rows.push({...x,kind:'source'});present.add(x.file);}); Object.entries(selections).filter(([file,id])=>validFiles.has(file)&&id&&id!=='none').forEach(([file,id])=>{if(present.has(file)||sourceRejected[file])return;const c=byId.get(`${file}::${id}`);if(c)rows.push({...c,kind:'candidate'});}); rows.sort((a,b)=>a.hebrew_name.localeCompare(b.hebrew_name,'he')); document.querySelector('#summary').textContent=`${rows.length} מאושרות · ${manifest.length-rows.length} חסרות מתוך ${manifest.length}`; app.innerHTML=rows.length?`<div class="grid">${rows.map(x=>`<article class="card"><img class="thumb" src="${esc(x.image_url)}" alt="${esc(x.hebrew_name)}" loading="lazy"><div class="copy"><span class="name">${esc(x.hebrew_name)}</span><span class="file">${esc(x.file)}</span><span class="meta">${esc(x.match||'')}</span><div class="actions"><a href="${esc(x.source_page_url)}" target="_blank" rel="noopener">מקור ↗</a><button class="remove" data-file="${esc(x.file)}" data-kind="${x.kind}" data-id="${esc(x.candidate_id||'')}">לא רוצה את התמונה</button></div></div></article>`).join('')}</div>`:'<div class="empty">אין תמונות מאושרות בדפדפן הזה.</div>'; app.querySelectorAll('.remove').forEach(btn=>btn.addEventListener('click',()=>{const file=btn.dataset.file;if(btn.dataset.kind==='source')sourceRejected[file]=true;else{delete selections[file];rejected[file]=[...new Set([...(rejected[file]||[]),btn.dataset.id])];}persist();render(current,candidates,archive,manifest);}));}
    sync(); const rev='202610021146'; Promise.all([load(`עצים/_sources.csv?v=${rev}`),load(`candidates.csv?v=${rev}`),load(`archive/candidates-offered-20261001-0829.csv?v=${rev}`),load(`archive/candidates-offered-20261002-1118.csv?v=${rev}`),load(`images-manifest.csv?v=${rev}`)]).then(([current,candidates,archiveFirst,archiveRejected,manifest])=>render(current,candidates,[...archiveFirst,...archiveRejected],manifest)).catch(()=>{app.innerHTML='<div class="empty">לא ניתן לטעון את הנתונים. פתח דרך הקישור המקומי.</div>';});
  </script>
</body>
</html>
