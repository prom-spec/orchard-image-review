const ovCache={};
async function openverse(q,nounSrc,tokSrc){
  const key=q+"|"+nounSrc+"|"+tokSrc;
  if(key in ovCache)return ovCache[key];
  const must=nounSrc?new RegExp(nounSrc,"i"):null,tok=tokSrc?new RegExp(tokSrc,"i"):null;
  try{
    const r=await fetch("https://api.openverse.org/v1/images/?q="+encodeURIComponent(q)+"&category=photograph&mature=false&page_size=30");
    if(!r.ok){wpErr="Openverse HTTP "+r.status;return [];}
    const d=await r.json();
    const scored=[];
    (d.results||[]).forEach((x,i)=>{
      const text=((x.title||"")+" "+(x.tags||[]).map(t=>t.name).join(" ")).toLowerCase();
      if(must&&!must.test(text))return;
      if(NEG.test(text))return;
      const hasFruit=/\b(fruit|fruits|ripe|hanging)\b/.test(text);
      if(TREE.test(text)&&!hasFruit)return;
      let sc=10-i*0.2;
      if(TREE.test(text))sc-=3;
      if(hasFruit)sc+=2;
      if(tok&&tok.test(text))sc+=4;
      if(/whole|halved|cut|ripe|closeup|close-up|macro/.test(text))sc+=1;
      if(x.width&&x.height&&Math.min(x.width,x.height)<300)return;
      scored.push({sc,x});
    });
    scored.sort((a,b)=>b.sc-a.sc);
    const res=scored.slice(0,12).map(({x})=>({src:x.thumbnail||x.url,link:x.foreign_landing_url,
      credit:(x.creator?x.creator+" · ":"")+(x.license?"CC "+x.license.toUpperCase()+" · ":"")+(x.source||"Openverse")}));
    ovCache[key]=res;return res;
  }catch(e){wpErr=String((e&&e.message)||e);return [];}
}
async function findImages(item,cid){
  const out=[],seen=new Set();
  const add=a=>a.forEach(x=>{if(x.src&&!seen.has(x.src)){seen.add(x.src);out.push(x);}});
  const spec=EQ[nrm(item.l)];
  const q=spec&&spec[0],tok=spec?spec[1]:"";
  const noun=NOUN[cid]||tok||"";
  if(q)add(await openverse(q,noun,tok));
  if(out.length<12&&QCAT[cid])add(await openverse(QCAT[cid],noun,""));
  return out;
}

/* ─── Bar ─── */
function Bar({label,months,color,hovered,onHover,uid,onClick,clickable}){
  const dim=hovered&&hovered!==uid;
  return(
    <div style={{display:"grid",gridTemplateColumns:"130px repeat(12,1fr)",marginBottom:3,opacity:dim?0.15:1,transition:"opacity 0.12s"}}>
      <div onClick={()=>{if(clickable&&onClick)onClick();else onHover(uid===hovered?null:uid)}}
        onMouseEnter={()=>onHover(uid)} onMouseLeave={()=>onHover(null)}
        style={{fontSize:10,color,fontWeight:600,whiteSpace:"normal",overflowWrap:"anywhere",lineHeight:"14px",minHeight:30,padding:"2px 4px 2px 2px",display:"flex",alignItems:"center",
          cursor:"pointer",textDecoration:clickable?"underline dotted":"none",textUnderlineOffset:3}}>
        {cleanVarietyName(label)}
      </div>
      {Array.from({length:12},(_,i)=>i+1).map(m=>{
        const on=months.includes(m),pv=months.includes(m===1?12:m-1),nx=months.includes(m===12?1:m+1);
        return(<div key={m} style={{minHeight:30,display:"flex",alignItems:"center",padding:"0 0.5px",position:"relative"}}>
          {m===NOW&&<div style={{position:"absolute",top:0,bottom:0,left:"50%",width:1.5,background:"rgba(45,106,63,0.25)",zIndex:0}}/>}
          {on&&<div style={{width:"100%",height:13,background:color,opacity:0.85,borderRadius:`${on&&!pv?"0 5px 5px 0":"0"} ${on&&!nx?"5px 0 0 5px":"0"}`,zIndex:1}}/>}
        </div>);
      })}
    </div>
  );
}

const B_EIN=dbl("אגוז מקדמיה","שקד אום אל פאחם","פקאן אפאצ'י","אגוז לוז","אלת פיסטוק");
const B_EOUT=[...dbl("פקאן צ'וקוטו","פקאן קפפר","פקאן מוהוק","אגוז קליפורניה"),
  ...dbl("פומלו","תפוז ניוהול","פומלית אדומה","אשכולית עליזה","קלמנטינה מיכל","תפוז ראוסטנברג","קלמנטינה אורה","פומלית","תפוז מורו","קלמנטינה אור","תפוז קרה קרה","שמוטי")];

const mapTreeCount=cell=>{
  const name=typeof cell==="object"?cell.n:cell;
  if(!name||name===P)return 0;
  const quantity=String(name).match(/^(\d+)\s+/);
  return quantity?Number(quantity[1]):1;
};
const totalTrees=()=>MAP_A.flat().reduce((sum,cell)=>sum+mapTreeCount(cell),0)+B_WL.length+B_WI.length+B_EIN.length+B_EOUT.length;

function Cell({name,search,span,small,pos,onPick,coord,isPlanned}){
  const clickTimer=useRef(null),coordTimer=useRef(null),[showCoord,setShowCoord]=useState(false);
  const path=name===P,cellName=path?"":name;
  const hit=search&&cellName&&cellName.includes(search);
  const dim=search&&!hit;
  const click=()=>{if(clickTimer.current)return;clickTimer.current=setTimeout(()=>{if(cellName&&onPick)onPick(cellName);clickTimer.current=null;},250);};
  const doubleClick=e=>{e.preventDefault();if(clickTimer.current){clearTimeout(clickTimer.current);clickTimer.current=null;}if(coord){setShowCoord(true);clearTimeout(coordTimer.current);coordTimer.current=setTimeout(()=>setShowCoord(false),2000);}};
  return <div style={{gridColumn:span?`span ${span}`:undefined,minHeight:34,padding:"3px 2px",fontSize:small?9.5:10.5,lineHeight:1.2,
    display:"flex",alignItems:"center",justifyContent:"center",textAlign:"center",direction:"rtl",
    background:path?PATH_BG:cellName?tileBg(cellName,isPlanned):"#fff",border:hit?"2px solid #C44D2B":"1px solid #fff",borderRadius:4,
    opacity:dim?0.3:1,fontWeight:hit?700:400,cursor:coord?"pointer":"default",userSelect:"none",WebkitUserSelect:"none",...pos}}
    onContextMenu={e=>e.preventDefault()} onClick={click} onDoubleClick={doubleClick}>{showCoord?coord:cellName}</div>;
}

function MapA({search,onPick}){
  return <div>
    <p style={{fontSize:10,color:"#9A958D",textAlign:"center",marginBottom:6}}>אפור = שביל · לחץ על עץ לסיכום · דאבל־קליק מציג משבצת</p>
    <div className="map-scroll" style={{overflowX:"auto"}}>
      <div className="map-a-grid" dir="rtl" style={{display:"grid",gridTemplateColumns:"repeat(14,minmax(62px,1fr))",gap:2,minWidth:14*64,background:"#E8E2D6",padding:2,borderRadius:6}}>
        {MAP_A.map((row,ri)=>{
          let used=0;const cells=row.map((c,ci)=>{const o=typeof c==="object"?c:{n:c},col=used+1,span=o.s||1,coord=gridCoord(ri+1,col,span);used+=span;return <Cell key={ri+"-"+ci} name={o.n} span={o.s} search={search} onPick={o.noPopup?undefined:onPick} coord={coord} isPlanned={plannedA(o.n,coord)} small/>;});
          for(let k=used;k<14;k++)cells.push(<Cell key={ri+"-f"+k} name="" search={search} coord={gridCoord(ri+1,k+1)}/>);
          return cells;
        })}
      </div>
    </div>
    <p style={{fontSize:10,color:"#B5B0A8",textAlign:"center",marginTop:6}}>תפוח ורד אדום — לא מופיע בצילום המסך</p>
  </div>;
}

function MapTop({txt,col,bg,pick,search,onPick,coord}){
  const clickTimer=useRef(null),coordTimer=useRef(null),[showCoord,setShowCoord]=useState(false),hit=search&&txt.includes(search);
  const click=()=>{if(clickTimer.current)return;clickTimer.current=setTimeout(()=>{if(pick)onPick(pick);clickTimer.current=null;},250);};
  const doubleClick=e=>{e.preventDefault();if(clickTimer.current){clearTimeout(clickTimer.current);clickTimer.current=null;}setShowCoord(true);clearTimeout(coordTimer.current);coordTimer.current=setTimeout(()=>setShowCoord(false),2000);};
  return <div style={{gridColumn:col,gridRow:1,padding:"6px 4px",fontSize:10.5,lineHeight:1.3,textAlign:"center",background:bg,borderRadius:4,direction:"rtl",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:hit?700:400,border:hit?"2px solid #C44D2B":"1px solid #fff",opacity:search&&!hit?0.3:1,cursor:"pointer",userSelect:"none",WebkitUserSelect:"none"}} onContextMenu={e=>e.preventDefault()} onClick={click} onDoubleClick={doubleClick}>{showCoord?coord:txt}</div>;
}

function MapB({search,onPick}){
  const place=(list,col,row0)=>list.map((n,i)=>{const coord=gridCoord(row0+i,col);return <Cell key={col+"-"+i} name={n} search={search} onPick={onPick} coord={coord} isPlanned={plannedB(n,coord)} small pos={{gridColumn:col,gridRow:row0+i,minHeight:28}}/>;});
  return <div>
    <p style={{fontSize:10,color:"#9A958D",textAlign:"center",marginBottom:6}}>כמו במפה המקורית · הגדר למעלה · כל תא = עץ אחד · דאבל־קליק מציג משבצת</p>
    <div className="map-scroll" style={{overflowX:"auto"}}>
      <div className="map-b-grid" dir="ltr" style={{display:"grid",gridTemplateColumns:"1fr 1fr 0.6fr 1fr 1fr",gap:2,minWidth:360,background:"#F7F5F0",padding:2,borderRadius:6}}>
        <MapTop txt="🍇 גפן על הגדר: עין ורד (5 ייחורים) · קרימזון ×2 · איזבלה ×2" col="1 / 3" bg="#EDE7F6" search={search} onPick={onPick} coord="A1–B1"/>
        <MapTop txt="🫐 פטל על הגדר: לנדאו ×2 · פריים ארק ×2 · רפאו ×2 · בויסן ×2" col="4 / 6" bg="#FCE4EC" search={search} onPick={onPick} coord="D1–E1"/>
        <Cell name="ערמון" search={search} onPick={onPick} coord="C2" isPlanned={planned("ערמון")} small pos={{gridColumn:3,gridRow:2,minHeight:28}}/>
        <Cell name="אגוז שחור" search={search} onPick={onPick} coord="C3" isPlanned={plannedB("אגוז שחור","C3")} small pos={{gridColumn:3,gridRow:3,minHeight:28}}/>
        <div style={{gridColumn:3,gridRow:"4 / span 30",background:PATH_BG,borderRadius:4}}/>
        {place(B_WL,1,2)}{place(B_WI,2,2)}{place(B_EIN,4,3)}{place(B_EOUT,5,2)}
      </div>
    </div>
  </div>;
}

function App(){
  const[view,setView]=useState("gantt");
  const[tab,setTab]=useState("harvest");
  const[selMonth,setSelMonth]=useState(NOW);
  const[actFilter,setActFilter]=useState(null);
  const[hovered,setHovered]=useState(null);
  const[search,setSearch]=useState("");
  const[modal,setModal]=useState(null);

  const filtered=useMemo(()=>{
    if(!search)return cats;
    return cats.filter(c=>c.n.includes(search)||c.v.includes(search)||c.care.some(a=>a.l.includes(search))||c.harvest.some(a=>a.l.includes(search)));
  },[search]);

  const monthData=useMemo(()=>filtered.map(c=>{
    const ca=tab==="care"?c.care.filter(a=>a.m.includes(selMonth)&&(!actFilter||a.t===actFilter)):[];
    const ha=tab==="harvest"?c.harvest.filter(a=>a.m.includes(selMonth)):[];
    return(ca.length||ha.length)?{...c,careActs:ca,harvestActs:ha}:null;
  }).filter(Boolean),[filtered,selMonth,actFilter,tab]);

  const total=useMemo(totalTrees,[]);
  const totalVar=useMemo(()=>cats.reduce((s,c)=>s+c.harvest.length,0),[]);

  const isMap=view==="mapA"||view==="mapB";
  const exportPicks=()=>{
    const o={};
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf("img:")===0)o[k.slice(4)]=JSON.parse(localStorage.getItem(k));}}catch(e){}
    const n=Object.keys(o).length;
    if(!n){alert("עוד לא נבחרו תמונות");return;}
    const txt=JSON.stringify(o);
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert("הועתקו "+n+" תמונות. הדבק אותן בצ'אט."),()=>window.prompt("העתק (Ctrl+C):",txt));
  };
  const pickTree=n=>{const r=lookupTree(n);setModal({item:r.item,emoji:r.emoji,cid:r.cid});};
  return(<div style={{padding:"16px 10px",minHeight:"100vh"}}>
    {modal&&<VarietyModal item={modal.item} catEmoji={modal.emoji} cid={modal.cid} onClose={()=>setModal(null)}/>}
    <div style={{maxWidth:680,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"center",alignItems:"baseline",gap:8,margin:"0 0 12px"}}>
        <h1 style={{fontSize:20,fontWeight:700,margin:0}}>בוסתן להבי בני ציון</h1>
        <span style={{fontSize:10,color:"#9A958D",whiteSpace:"nowrap"}}>{total} עצים · {totalVar} זנים</span>
      </div>

      <div style={{display:"flex",marginBottom:10,borderRadius:8,overflow:"hidden",border:"1px solid #D8D3CA"}}>
        {[{id:"gantt",l:"📊 שנתי"},{id:"monthly",l:"📅 חודשי"},{id:"mapA",l:"🗺️ שטח א"},{id:"mapB",l:"🗺️ שטח ב"}].map(v=>(<button key={v.id} onClick={()=>setView(v.id)} style={{flex:1,padding:"8px 0",fontSize:12,fontWeight:600,border:"none",cursor:"pointer",background:view===v.id?"#2D6A3F":"#fff",color:view===v.id?"#fff":"#555"}}>{v.l}</button>))}
      </div>

      {!isMap&&<div style={{display:"flex",marginBottom:10,borderRadius:8,overflow:"hidden",border:"1px solid #D8D3CA"}}>
        <button onClick={()=>{setTab("care");setActFilter(null)}} style={{flex:1,padding:"7px 0",fontSize:12,fontWeight:600,border:"none",cursor:"pointer",background:tab==="care"?"#4A7C59":"#fff",color:tab==="care"?"#fff":"#666"}}>✂️ טיפול</button>
        <button onClick={()=>{setTab("harvest");setActFilter(null)}} style={{flex:1,padding:"7px 0",fontSize:12,fontWeight:600,border:"none",cursor:"pointer",background:tab==="harvest"?"#C44D2B":"#fff",color:tab==="harvest"?"#fff":"#666"}}>🍎 קטיף</button>
      </div>}

      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 חפש עץ, זן או פעילות..." style={{width:"100%",padding:"9px 12px",fontSize:16,border:"1px solid #D8D3CA",borderRadius:8,marginBottom:10,background:"#fff",outline:"none"}}/>

      {!isMap&&tab==="harvest"&&<p style={{fontSize:10,color:"#C44D2B",textAlign:"center",marginBottom:8}}>👆 לחץ על זן למידע ועונת קטיף</p>}

      {!isMap&&tab==="care"&&<div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10}}>
        <button onClick={()=>setActFilter(null)} style={{padding:"4px 10px",fontSize:10,border:"1px solid #D8D3CA",borderRadius:12,cursor:"pointer",background:!actFilter?"#2D2A26":"#fff",color:!actFilter?"#fff":"#777",fontWeight:600}}>הכל</button>
        {Object.entries(careTypes).map(([k,v])=>{
          const has=view==="gantt"?filtered.some(c=>c.care.some(a=>a.t===k)):filtered.some(c=>c.care.some(a=>a.t===k&&a.m.includes(selMonth)));
          if(!has)return null;
          return(<button key={k} onClick={()=>setActFilter(actFilter===k?null:k)} style={{padding:"4px 9px",fontSize:10,border:`1px solid ${actFilter===k?v.c:"#D8D3CA"}`,borderRadius:12,cursor:"pointer",background:actFilter===k?v.c:"#fff",color:actFilter===k?"#fff":"#777",fontWeight:600}}>{v.icon} {v.l}</button>);
        })}
      </div>}

      {view==="mapA"&&<MapA search={search} onPick={pickTree}/>}
      {view==="mapB"&&<MapB search={search} onPick={pickTree}/>}

      {view==="gantt"&&<div style={{overflowX:"auto"}}><div style={{minWidth:540}}>
        <MonthHeader/>
        {tab==="care"
          ? Object.entries(careTypes).map(([k,info])=>{
              if(actFilter&&actFilter!==k)return null;
              // collect every (category, action) of this type
              const rows=[];
              filtered.filter(cat=>cat.id!=="nuts").forEach(cat=>cat.care.forEach(a=>{if(a.t===k)separateCareNames(cat.n).forEach(n=>rows.push({cat:{...cat,n},a}));}));
              if(!rows.length)return null;
              const fakeCat={id:"act-"+k,n:`${info.icon} ${info.l}`,e:""};
              return <CatSection key={k} cat={fakeCat} count={rows.length}>
                {rows.map((r,i)=><Bar key={i} label={`${r.cat.e} ${r.cat.n}${careExtra(r.a.l,info.l)?" · "+careExtra(r.a.l,info.l):""}`} months={r.a.m} color={info.c} uid={`${k}-${i}`} hovered={hovered} onHover={setHovered} clickable={false}/>)}
              </CatSection>;
            })
          : filtered.map(cat=>{
              if(!cat.harvest.length)return null;
              return <CatSection key={cat.id} cat={cat} count={cat.harvest.length}>
                {cat.harvest.map((h,i)=><Bar key={i} label={h.l} months={h.m} color={h.c} uid={`${cat.id}-h-${i}`} hovered={hovered} onHover={setHovered} clickable={true} onClick={()=>setModal({item:h,emoji:cat.e,cid:cat.id})}/>)}
              </CatSection>;
            })}
      </div></div>}

      {view==="monthly"&&<>
        <div style={{display:"flex",gap:4,marginBottom:8,overflowX:"auto",paddingBottom:4}}>
          {MF.map((name,i)=>{const m=i+1;return(<button key={m} onClick={()=>setSelMonth(m)} style={{flexShrink:0,padding:"6px 9px",fontSize:11,fontWeight:m===selMonth?700:400,border:m===NOW?"2px solid #2D6A3F":"1px solid #D8D3CA",borderRadius:16,cursor:"pointer",background:m===selMonth?"#2D6A3F":"#fff",color:m===selMonth?"#fff":m===NOW?"#2D6A3F":"#555"}}>{name}</button>);})}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {tab==="care"
            ? (()=>{
                // group this month's care actions by action type
                const groups=Object.entries(careTypes).map(([k,info])=>{
                  if(actFilter&&actFilter!==k)return null;
                  const trees=[];
                  filtered.filter(cat=>cat.id!=="nuts").forEach(cat=>cat.care.forEach(a=>{if(a.t===k&&a.m.includes(selMonth))separateCareNames(cat.n).forEach(n=>trees.push(n+(careExtra(a.l,info.l)?" ("+careExtra(a.l,info.l)+")":"")));}));
                  return trees.length?{k,info,trees}:null;
                }).filter(Boolean);
                if(!groups.length)return <p style={{textAlign:"center",color:"#AAA",fontSize:13,marginTop:20}}>אין טיפולים ב{MF[selMonth-1]}</p>;
                return groups.map(g=>(
                  <div key={g.k} style={{background:"#fff",borderRadius:10,padding:"10px 12px",boxShadow:"0 1px 3px rgba(0,0,0,0.05)",border:"1px solid #E8E2D6"}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8,paddingBottom:6,borderBottom:`2px solid ${g.info.c}`}}>
                      <span style={{fontSize:16}}>{g.info.icon}</span><span style={{fontSize:14,fontWeight:700,color:g.info.c}}>{g.info.l}</span>
                      <span style={{fontSize:11,color:"#bbb",marginRight:"auto"}}>{g.trees.length} עצים</span>
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:"4px 10px"}}>
                      {g.trees.map((t,i)=><span key={i} style={{fontSize:12,fontWeight:400}}>{t}</span>)}
                    </div>
                  </div>
                ));
              })()
            : (monthData.length
                ? monthData.map(cat=>(<div key={cat.id} style={{background:"#fff",borderRadius:10,padding:"10px 12px",boxShadow:"0 1px 3px rgba(0,0,0,0.05)",border:"1px solid #E8E2D6"}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                      <span style={{fontSize:15}}>{cat.e}</span><span style={{fontSize:13,fontWeight:700}}>{cat.n}</span>
                    </div>
                    {cat.harvestActs.map((h,i)=>(<div key={i} onClick={()=>setModal({item:h,emoji:cat.e,cid:cat.id})} style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,cursor:"pointer"}}>
                      <div style={{width:4,height:18,borderRadius:2,background:h.c,flexShrink:0}}/><span style={{fontSize:12,fontWeight:400,textDecoration:"underline dotted",textUnderlineOffset:3}}>{cleanVarietyName(h.l)}</span>
                    </div>))}
                  </div>))
                : <p style={{textAlign:"center",color:"#AAA",fontSize:13,marginTop:20}}>אין קטיף ב{MF[selMonth-1]}</p>)}
        </div>
      </>}

      <div style={{textAlign:"center",marginTop:14}}>
        <button onClick={exportPicks} style={{fontSize:11,padding:"6px 12px",border:"1px solid #D8D3CA",borderRadius:12,background:"#fff",cursor:"pointer"}}>📤 ייצא את התמונות שבחרתי</button>
      </div>
      <p style={{textAlign:"center",fontSize:10,color:"#B5B0A8",marginTop:16,lineHeight:1.8}}>⏱ מותאם לאקלים השרון · 💧 כולם על אותה מערכת השקיה<br/>📅 טיפול מקובץ לפי פעולה · 🍎 קטיף לפי זן (לחץ למידע)</p>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
