<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בחירת תמונות למטע</title>
  <style>
    :root { color-scheme: light; --ink:#1c2930; --muted:#617078; --line:#dbe4e6; --bg:#f6f8f7; --card:#fff; --accent:#246b49; --warn:#9b4f17; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial,"Noto Sans Hebrew",sans-serif; }
    header { position:sticky; top:0; z-index:2; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); padding:14px max(16px,calc((100% - 1180px)/2)); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    h1 { font-size:1.25rem; margin:0; } .hint { color:var(--muted); font-size:.9rem; flex:1; }
    button { border:0; border-radius:8px; background:var(--accent); color:#fff; padding:9px 13px; cursor:pointer; font:inherit; } button:hover { filter:brightness(.94); }
    main { max-width:1180px; margin:22px auto; padding:0 16px 48px; } .notice { background:#fff8e9; border:1px solid #eed39b; color:#684d13; padding:12px; border-radius:10px; margin-bottom:18px; }
    .category { margin:30px 0 10px; font-size:1.2rem; } .variety { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0; }
    .variety-head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; } .variety-name { font-weight:700; } .filename { direction:ltr; font:12px ui-monospace,monospace; color:var(--muted); }
    .choices { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-top:12px; } label.choice { position:relative; display:block; border:2px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; cursor:pointer; }
    label.choice:has(input:checked) { border-color:var(--accent); box-shadow:0 0 0 2px #b8dec9; } label.choice input { position:absolute; opacity:0; }
    .thumb { width:100%; aspect-ratio:4/3; object-fit:cover; background:#edf1f1; display:block; } .choice-copy { padding:9px; display:grid; gap:4px; font-size:.87rem; }
    .tag { width:max-content; border-radius:999px; background:#e8f4ec; color:#175c3b; padding:2px 7px; font-size:.75rem; } .tag.generic { background:#fff1e6; color:var(--warn); } .source { color:#245c95; text-decoration:none; font-size:.8rem; }
    .empty { color:var(--muted); margin:9px 0 0; } .no-choice { min-height:124px; display:flex; align-items:center; justify-content:center; text-align:center; padding:15px; color:var(--muted); }
    @media (max-width:540px) { header { position:static; } .choices { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <header><h1>בחירת תמונות למטע</h1><span class="hint" id="summary">טוען מועמדים…</span><a href="approved-images.html">תמונות מאושרות</a><button id="download" type="button">הורדת הבחירות CSV</button></header>
  <main><div class="notice">מוצגים רק זנים שעדיין לא נבחרה להם תמונה. לכל זן בחר תמונה אחת, או “אין מועמד מתאים”. הבחירות נשמרות בדפדפן; הורדת הקבצים הסופיים נעשית רק לאחר הבחירה.</div><div id="app"></div></main>
  <script>
    const KEY = 'orchard-image-choices-v1';
    const REJECTED_KEY = 'orchard-image-rejected-candidates-v1';
    const SOURCE_REJECTED_KEY = 'orchard-image-source-rejections-v1';
    const app = document.querySelector('#app');
    const selections = JSON.parse(localStorage.getItem(KEY) || '{}');
    const rejected = JSON.parse(localStorage.getItem(REJECTED_KEY) || '{}');
    const sourceRejected = JSON.parse(localStorage.getItem(SOURCE_REJECTED_KEY) || '{}');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function csv(text) {
      const rows=[]; let row=[], cell='', quote=false;
      for (let i=0;i<text.length;i++) { const c=text[i], n=text[i+1]; if (c==='"' && quote && n==='"') { cell+='"'; i++; } else if (c==='"') quote=!quote; else if (c===',' && !quote) { row.push(cell); cell=''; } else if ((c==='\n'||c==='\r') && !quote) { if (c==='\r'&&n==='\n') i++; row.push(cell); if(row.some(Boolean)) rows.push(row); row=[]; cell=''; } else cell+=c; }
      if (cell||row.length) { row.push(cell); rows.push(row); } const [head,...data]=rows; return data.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])));
    }
    async function load(path) { const r=await fetch(path, {cache:'no-store'}); if(!r.ok) throw new Error(path); return csv(await r.text()); }
    function sync() { fetch('/api/selections', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({selections,rejected,sourceRejected})}).catch(()=>{}); }
    function save() { localStorage.setItem(KEY, JSON.stringify(selections)); localStorage.setItem(REJECTED_KEY, JSON.stringify(rejected)); sync(); updateSummary(); }
    function updateSummary() { const files = Object.keys(window.exportRows || {}); const total = files.length; const picked=files.filter(file=>selections[file] && selections[file] !== 'none').length; const completed=window.completedCount || 0; document.querySelector('#summary').textContent = `${completed} כבר נבחרו · ${picked} מתוך ${total} חדשים נבחרו`; }
    function candidateCard(row, c) {
      const id=`${row.file}::${c.candidate_id}`; const checked=selections[row.file]===c.candidate_id?'checked':''; const tag=c.match==='exact'?'exact':'generic';
      return `<label class="choice"><input type="radio" name="${esc(row.file)}" value="${esc(c.candidate_id)}" ${checked}><img class="thumb" src="${esc(c.image_url)}" alt="${esc(row.hebrew_name)}" loading="lazy"><span class="choice-copy"><strong>${esc(c.candidate_label || 'מועמד')}</strong><span class="tag ${tag==='generic'?'generic':''}">${tag}</span><a class="source" href="${esc(c.source_page_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">מקור ↗</a></span></label>`;
    }
    function render(rows, candidates, current) {
      const completed=new Set(current.filter(x=>!sourceRejected[x.file]).map(x=>x.file));
      const unchosen=rows.filter(r=>!completed.has(r.file));
      const pending=unchosen.filter(r=>!selections[r.file] || selections[r.file]==='none');
      const byFile={};
      candidates.forEach(c=>(byFile[c.file]??=[]).push(c));
      const ordered=[...pending].sort((a,b)=>(byFile[b.file]?.length||0)-(byFile[a.file]?.length||0));
      window.completedCount=completed.size; window.exportRows=Object.fromEntries(unchosen.map(r=>[r.file,r])); window.varieties=Object.fromEntries(ordered.map(r=>[r.file,r]));
      const categories=[...new Set(ordered.map(r=>r.category))]; app.innerHTML=categories.map(category=>`<section><h2 class="category">${esc(category)}</h2>${ordered.filter(r=>r.category===category).map(row=>{ const list=(byFile[row.file]||[]).filter(c=>!(rejected[row.file]||[]).includes(c.candidate_id)); return `<article class="variety"><div class="variety-head"><span class="variety-name">${esc(row.hebrew_name)}</span><span class="filename">${esc(row.file)}</span></div><div class="choices">${list.map(c=>candidateCard(row,c)).join('')}<label class="choice no-choice"><input type="radio" name="${esc(row.file)}" value="none" ${selections[row.file]==='none'?'checked':''}><span>אין מועמד מתאים</span></label></div>${list.length?'':'<p class="empty">עדיין אין מועמד.</p>'}</article>`;}).join('')}</section>`).join('');
      app.querySelectorAll('input[type=radio]').forEach(input=>input.addEventListener('change',e=>{ const file=e.target.name; selections[file]=e.target.value; if(e.target.value==='none') rejected[file]=[...new Set([...(rejected[file]||[]),...(byFile[file]||[]).map(c=>c.candidate_id)])]; save(); render(rows,candidates,current); })); updateSummary();
    }
    document.querySelector('#download').addEventListener('click',()=>{ const lines=['file,hebrew_name,selection']; Object.values(window.exportRows||{}).forEach(r=>lines.push([r.file,r.hebrew_name,selections[r.file]||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))); const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='orchard-image-selections.csv'; a.click(); URL.revokeObjectURL(a.href); });
    sync(); const rev = '202610021146';
    Promise.all([load(`images-manifest.csv?v=${rev}`),load(`candidates.csv?v=${rev}`),load(`עצים/_sources.csv?v=${rev}`)]).then(([rows,candidates,current])=>render(rows,candidates,current)).catch(()=>{ app.innerHTML='<div class="notice">פתח את הדף דרך שרת מקומי, לא דרך file://. ההוראות נמצאות ב־README-choices.md.</div>'; document.querySelector('#summary').textContent='נדרש שרת מקומי'; });
  </script>
</body>
</html>
